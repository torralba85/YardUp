name: "❓ Question / Discussion"
description: "Ask a question about YardUp setup, architecture, or usage"
title: "[QUESTION]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about YardUp? Please provide details below.
  - type: textarea
    id: question
    attributes:
      label: "Your Question"
      description: "What would you like to know or clarify?"
      placeholder: "Ask your question..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "Any background details, links, error outputs, or attempted steps."
    validations:
      required: false
