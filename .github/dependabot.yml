version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/functions"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) ships no JavaScript compiler API.
      # scripts/design/audit.mjs, typescript-eslint and the Next.js build all
      # need that API, so a major bump breaks lint and build. Revisit once
      # those tools support TypeScript 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Production Firebase Functions (functions/package.json engines.node: "22")
      # and CI run Node 22. Hold @types/node major bumps so Node 24/26-only APIs
      # cannot pass tsc and fail at runtime on Node 22.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # firebase@13.x declares engines.node >=24.12.0, and @firebase/rules-unit-testing@6
      # requires peer firebase@^13.0.0. Hold both major bumps until CI and
      # Firebase Functions upgrade to Node 24.
      - dependency-name: "firebase"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@firebase/rules-unit-testing"
        update-types:
          - "version-update:semver-major"
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      firebase-client:
        patterns:
          - "firebase"
          - "@firebase/rules-unit-testing"
      shared-runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "firebase-admin"
          - "firebase-functions"
          - "resend"
          - "stripe"
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/native/android"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
