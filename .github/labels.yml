# Canonical label taxonomy for torralba85/YardUp.
#
# This is the source of truth for label names/colors/descriptions referenced
# by .github/triage_checklist.md, .github/ISSUE_TEMPLATE/*, and
# docs/repo-governance.md. It is not currently wired to an automated sync
# action — apply it manually via the GitHub UI, or with a label-sync tool
# such as https://github.com/EndBug/label-sync, e.g.:
#
#   - uses: EndBug/label-sync@v2
#     with:
#       config-file: .github/labels.yml

# --- Type ---
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working as expected"
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality or enhancement request"
- name: "type: chore"
  color: "cfd3d7"
  description: "Tooling, deps, config, non-behavioral cleanup"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: security"
  color: "b60205"
  description: "Security vulnerability or hardening; see SECURITY.md for disclosure"

# --- Status (triage lifecycle) ---
- name: "status: triage"
  color: "ededed"
  description: "Newly filed, not yet triaged"
- name: "status: needs-repro"
  color: "fbca04"
  description: "Missing reproduction steps, environment info, or an MRE"
- name: "status: confirmed"
  color: "0e8a16"
  description: "Reproduced and accepted; ready to be worked"
- name: "status: in-progress"
  color: "1d76db"
  description: "Actively being worked on"
- name: "status: blocked"
  color: "e99695"
  description: "Blocked on an external dependency, decision, or another issue"
- name: "status: stale"
  color: "eeeeee"
  description: "No activity for an extended period; scheduled for closure absent a response"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked; closed with rationale in a comment"

# --- Priority (see docs/repo-governance.md#priority-framework-severity--impact) ---
- name: "P0"
  color: "b60205"
  description: "Drop everything — prod down, security, payments, or data integrity"
- name: "P1"
  color: "d93f0b"
  description: "Next up — core flow broken for a meaningful slice of users, no workaround"
- name: "P2"
  color: "fbca04"
  description: "Scheduled — real bug/gap, workaround exists or narrow surface area"
- name: "P3"
  color: "c2e0c6"
  description: "Backlog — cosmetic, copy, nice-to-have"

# --- Area (component/surface) ---
- name: "area: studio"
  color: "5319e7"
  description: "FeasibilityStudio, ParcelScene, studio panels"
- name: "area: builder"
  color: "5319e7"
  description: "Builder dashboard, inbox, lead cards, unlock slips"
- name: "area: auth"
  color: "5319e7"
  description: "Firebase Auth, login/signup/forgot-password flows"
- name: "area: ai"
  color: "5319e7"
  description: "AI panels, app/api/ai/*, lib/server/openai.ts"
- name: "area: payments"
  color: "5319e7"
  description: "Stripe checkout/webhook, lead-unlock marketplace"
- name: "area: firebase"
  color: "5319e7"
  description: "Hosting, Functions, Firestore rules/indexes, deploy pipeline"
- name: "area: landing"
  color: "5319e7"
  description: "Marketing/landing pages"

# --- Community / contribution ---
- name: "good-first-issue"
  color: "7057ff"
  description: "Small, well-scoped, good entry point for a new contributor"
- name: "help-wanted"
  color: "008672"
  description: "Extra attention or an outside contributor welcome"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked by another issue; closed with a cross-link"
