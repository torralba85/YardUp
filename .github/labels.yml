# Label taxonomy for torralba85/YardUp.
# Referenced by .github/ISSUE_TEMPLATE/*, .github/triage_checklist.md, and
# .github/stale_branch_cleanup.md. Synced to the repo by
# .github/workflows/labels.yml on every push to master that touches this file.

# --- Type -------------------------------------------------------------
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working as expected"
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality or enhancement request"
- name: "type: chore"
  color: "cfd3d7"
  description: "Tooling, dependency, or non-behavioral cleanup"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation-only change"
- name: "type: security"
  color: "b60205"
  description: "Security vulnerability or hardening (see SECURITY.md)"

# --- Status -------------------------------------------------------------
- name: "status: triage"
  color: "fbca04"
  description: "New issue awaiting first triage pass"
- name: "status: needs-repro"
  color: "fbca04"
  description: "Missing reproduction steps, environment info, or an MRE"
- name: "status: confirmed"
  color: "0e8a16"
  description: "Reproduced and accepted; ready to be worked"
- name: "status: in-progress"
  color: "1d76db"
  description: "Actively being worked on"
- name: "status: blocked"
  color: "5319e7"
  description: "Blocked on an external dependency, decision, or upstream fix"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on; closed with rationale in a comment"
- name: "stale"
  color: "e4e669"
  description: "No activity for 45+ days; candidate for closure per stale_branch_cleanup.md"

# --- Priority (severity x impact, see triage_checklist.md) --------------
- name: "P0"
  color: "b60205"
  description: "Critical: production down, data loss, or security exposure. Fix immediately."
- name: "P1"
  color: "d93f0b"
  description: "High: major feature broken or blocking release. Fix this cycle."
- name: "P2"
  color: "fbca04"
  description: "Medium: workaround exists; schedule normally."
- name: "P3"
  color: "c2e0c6"
  description: "Low: minor/cosmetic; fix opportunistically."

# --- Area (mirrors the top-level source directories) ---------------------
- name: "area: landing"
  color: "bfd4f2"
  description: "app/page.tsx, components/landing/*"
- name: "area: studio"
  color: "bfd4f2"
  description: "FeasibilityStudio, components/studio/*, ParcelScene"
- name: "area: parcel"
  color: "bfd4f2"
  description: "lib/parcel-*, app/api/{parcel,aerial,geocode,suggest}"
- name: "area: builder"
  color: "bfd4f2"
  description: "components/builder/*, builder dashboard/lead flows"
- name: "area: ai"
  color: "bfd4f2"
  description: "lib/ai-*, lib/server/openai.ts, app/api/ai/*"
- name: "area: stripe"
  color: "bfd4f2"
  description: "lib/stripe.ts, lib/lead-unlock-*, app/api/stripe/*"
- name: "area: auth"
  color: "bfd4f2"
  description: "Firebase Auth, login/signup/forgot-password"
- name: "area: firebase"
  color: "bfd4f2"
  description: "Hosting, Cloud Functions, Firestore rules/indexes, deploy"
- name: "area: ci"
  color: "bfd4f2"
  description: ".github/workflows/*, CI/CD pipeline health"

# --- Community ------------------------------------------------------------
- name: "good-first-issue"
  color: "7057ff"
  description: "Small, self-contained, well-scoped for a new contributor"
