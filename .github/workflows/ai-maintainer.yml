name: "AI Maintainer Intake"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  record-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Post maintainer intake
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const issueNumber = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                "🤖 **AI Maintainer intake**",
                "",
                `Received issue #${issueNumber}.`,
                "This workflow records the issue without making a generic diagnosis from untrusted issue text.",
                "A maintainer can classify the issue, identify the affected code, and report verified next steps.",
              ].join("\n")
            });
