name: "AI Autonomous Maintainer"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Post maintainer intake
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.issue.title;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                "🤖 **AI Maintainer intake**",
                "",
                `Received: **${issueTitle}**.`,
                "This workflow records the issue without making a generic diagnosis from untrusted issue text.",
                "A maintainer run will classify the issue, identify the affected code, and report verified next steps.",
              ].join("\\n")
            });
