name: Apply PR 21 Fixes

on:
  push:
    branches:
      - codex/three-interface-upgrade

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/three-interface-upgrade
      - name: Apply surgical review fixes
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('components/ParcelScene.tsx')
          text = path.read_text(encoding='utf-8-sig')

          replacements = {
              '  }, [aduPos, config.height, mode, parcel.lotLength]);\n\n  useEffect(() => {\n    active.current = true;\n  }, [destination]);':
              '  }, [aduPos, config.height, mode, parcel.lotLength]);\n\n  useEffect(() => {\n    active.current = true;\n  }, [mode, parcel.lotLength]);',
              '    const halfWidth = parcel.lotWidth / 2 - parcel.setbacks.side - config.width / 2;\n    const halfLength = parcel.lotLength / 2 - parcel.setbacks.front - config.length / 2;\n    return { maxX: halfWidth, minX: -halfWidth, maxZ: -parcel.setbacks.rear + parcel.lotLength / 2 - config.length / 2, minZ: -halfLength };':
              '    const halfWidth = parcel.lotWidth / 2 - parcel.setbacks.side - config.width / 2;\n    const minZ = -parcel.lotLength / 2 + parcel.setbacks.rear + config.length / 2;\n    const maxZ = parcel.lotLength / 2 - parcel.setbacks.front - config.length / 2;\n    return { maxX: halfWidth, minX: -halfWidth, maxZ, minZ };',
              '    setIsDraggingActive(false);\n    if (controlsRef.current) controlsRef.current.enabled = true;':
              '    setIsDraggingActive(false);\n    setIsHovered(false);\n    if (controlsRef.current) controlsRef.current.enabled = true;',
              '        position={[x, isHovered ? 0.35 : 0, z]}':
              '        position={[x, isHovered || isDraggingActive ? 0.35 : 0, z]}',
              '        onPointerOut={() => {\n          if (!isDragging.current) setIsHovered(false);\n        }}':
              '        onPointerOut={() => {\n          setIsHovered(false);\n        }}',
              '    const halfW = parcel.lotWidth / 2 - parcel.setbacks.side - config.width / 2;\n    const halfL = parcel.lotLength / 2 - parcel.setbacks.front - config.length / 2;\n    const rearZ = -parcel.setbacks.rear + parcel.lotLength / 2 - config.length / 2;\n    return { minX: -halfW, maxX: halfW, minZ: -halfL, maxZ: rearZ };':
              '    const halfW = parcel.lotWidth / 2 - parcel.setbacks.side - config.width / 2;\n    const minZ = -parcel.lotLength / 2 + parcel.setbacks.rear + config.length / 2;\n    const maxZ = parcel.lotLength / 2 - parcel.setbacks.front - config.length / 2;\n    return { minX: -halfW, maxX: halfW, minZ, maxZ };',
              '              aria-pressed={active}\n              className=':
              '              aria-pressed={active}\n              aria-label={label}\n              className=',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected snippet:\n{old}')
              text = text.replace(old, new, 1)

          mojibake_replacements = {
              'â€”': '—',
              'â†â†’': '←→',
              'â†‘â†“': '↑↓',
          }
          for old, new in mojibake_replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-pr-21-fixes.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ParcelScene.tsx .github/workflows/apply-pr-21-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: address parcel scene review feedback"
          git push origin HEAD:codex/three-interface-upgrade
