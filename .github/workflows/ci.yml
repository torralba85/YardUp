name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-production-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write app and functions env from secrets
        run: |
          cat > functions/.env <<EOF
          GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}"
          NEXT_PUBLIC_GOOGLE_PLACES_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_KEY }}"
          REGRID_API_KEY="${{ secrets.REGRID_API_KEY }}"
          OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          EOF
          cat > .env.production.local <<EOF
          NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}"
          NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"
          NEXT_PUBLIC_GOOGLE_PLACES_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_KEY }}"
          EOF
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - run: npm run build:firebase
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
      - name: Firebase deploy dry run
        run: firebase deploy --only hosting,functions,firestore:rules --project yardup-2026 --dry-run
      - name: Deploy Firebase Hosting + Firestore Rules
        run: |
          set -o pipefail
          deploy_log="$(mktemp)"
          firebase deploy --only hosting,firestore:rules --project yardup-2026 2>&1 | tee "$deploy_log" || {
            if grep -F "is the current active version" "$deploy_log"; then
              echo "::notice::Firebase Hosting version is already active; continuing."
            else
              exit 1
            fi
          }
      - name: Deploy Firebase Functions
        run: |
          set -o pipefail
          for target in functions:app functions:api functions:apiAi functions:apiStripe; do
            deploy_log="$(mktemp)"
            firebase deploy --only "$target" --project yardup-2026 2>&1 | tee "$deploy_log"
            if grep -E "(failed to update function|HTTP Error: 409|unable to queue the operation)" "$deploy_log"; then
              echo "::error::Firebase reported a function update failure while deploying $target."
              exit 1
            fi
          done
