# Temporary, manually-dispatched relay: the remote dev environment's network
# policy blocks the Higgsfield CDN, so a runner (full egress) downloads the
# generated landing imagery, optimizes it, and commits it to this branch.
# Delete this file once the assets are committed.
name: Fetch landing assets

on:
  workflow_dispatch:
    inputs:
      hero_url:
        description: "URL of the aerial blue-hour hero image"
        required: true
        type: string
      adu_url:
        description: "URL of the eye-level dusk ADU image"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize images
        run: |
          mkdir -p public/landing
          curl -fsSLo /tmp/hero.png "${{ inputs.hero_url }}"
          curl -fsSLo /tmp/adu.png "${{ inputs.adu_url }}"
          convert /tmp/hero.png -resize 2560x -strip -interlace Plane -quality 82 public/landing/hero-dusk.jpg
          convert /tmp/hero.png -resize 1280x -strip -quality 70 public/landing/hero-dusk-poster.jpg
          convert /tmp/adu.png -resize 1920x -strip -interlace Plane -quality 82 public/landing/adu-dusk.jpg
          identify public/landing/*.jpg
          ls -la public/landing
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing
          git commit -m "chore(landing): add blue-hour hero imagery"
          git push
