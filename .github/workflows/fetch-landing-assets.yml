# Temporary relay: the remote dev environment's network policy blocks the
# Higgsfield CDN, so a runner (full egress) downloads the generated landing
# imagery, optimizes it, and commits it to this branch. Runs on push to the
# feature branch and no-ops once the assets exist. Delete before merge.
name: Fetch landing assets

on:
  push:
    branches: [claude/animated-landing-page-design-zlzj2z]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download, optimize, and commit images
        run: |
          if [ -f public/landing/hero-dusk.jpg ]; then
            echo "Assets already present; nothing to do."
            exit 0
          fi
          if ! command -v magick >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          IM="$(command -v magick || command -v convert)"
          mkdir -p public/landing
          curl -fsSLo /tmp/hero.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G3XBbmynn6BWoSh7I8ETDtDkFc/hf_20260704_214935_ef43390c-9ee2-45e4-bacc-9dac0c790e38.png"
          curl -fsSLo /tmp/adu.png "https://d8j0ntlcm91z4.cloudfront.net/user_3G3XBbmynn6BWoSh7I8ETDtDkFc/hf_20260704_214951_2e076295-2a6d-4dcd-b394-3e4d0df6acad.png"
          "$IM" /tmp/hero.png -resize 2560x -strip -interlace Plane -quality 82 public/landing/hero-dusk.jpg
          "$IM" /tmp/hero.png -resize 1280x -strip -quality 70 public/landing/hero-dusk-poster.jpg
          "$IM" /tmp/adu.png -resize 1920x -strip -interlace Plane -quality 82 public/landing/adu-dusk.jpg
          ls -la public/landing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/landing
          git commit -m "chore(landing): add blue-hour hero imagery"
          git push
