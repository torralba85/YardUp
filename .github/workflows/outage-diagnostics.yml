name: Production Outage Diagnostics

on:
  push:
    branches: [codex/lotfoundry-outage-20261015]
    paths: [.github/workflows/outage-diagnostics.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reproduce address lookup responses
        shell: bash
        run: |
          python3 <<'PY'
          import json, time, urllib.request, urllib.error, urllib.parse
          base = "https://lotfoundry.net"
          queries = [
              ("/api/geocode", {"q": "1515 goldrush way oceanside ca"}),
              ("/api/geocode", {"q": "1515 Goldrush Way, Oceanside, CA 92057"}),
          
          ]
          for path, params in queries:
              url = base + path + "?" + urllib.parse.urlencode(params)
              started = time.time()
              try:
                  with urllib.request.urlopen(url, timeout=40) as res:
                      body = res.read().decode()
                      print(json.dumps({"url": url, "status": res.status, "seconds": round(time.time()-started,2), "body": body[:6500]}))
              except urllib.error.HTTPError as err:
                  print(json.dumps({"url": url, "status": err.code, "seconds": round(time.time()-started,2), "body": err.read().decode()[:2000]}))
              except Exception as err:
                  print(json.dumps({"url":url,"error":str(err),"seconds":round(time.time()-started,2)}))
          PY
      - name: Authenticate for read-only Firebase diagnostics
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
      - name: Read API function state
        run: |
          gcloud functions describe api --gen2 --region=us-central1 \
            --project=yardup-2026 \
            --format='json(name,state,stateMessages,updateTime,buildConfig.runtime,serviceConfig.availableMemory,serviceConfig.timeoutSeconds)'
      - name: Read search service errors
        if: always()
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="api" AND httpRequest.requestUrl:"1515"' \
            --project=yardup-2026 --freshness=6h --limit=25 \
            --format='json(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.requestUrl,httpRequest.latency,httpRequest.userAgent,textPayload,jsonPayload.message)'
