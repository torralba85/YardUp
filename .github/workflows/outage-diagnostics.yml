name: Production Outage Diagnostics

on:
  push:
    branches: [codex/lotfoundry-outage-20261015]
    paths: [.github/workflows/outage-diagnostics.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public DNS and HTTPS responses
        shell: bash
        run: |
          set -u
          for host in lotfoundry.net www.lotfoundry.net auth.lotfoundry.net yardup-2026.web.app; do
            echo "::group::DNS $host"
            getent ahostsv4 "$host" || true
            echo "::endgroup::"
          done
          for url in \
            https://lotfoundry.net/ \
            https://lotfoundry.net/studio \
            https://lotfoundry.net/robots.txt \
            https://www.lotfoundry.net/ \
            https://auth.lotfoundry.net/__/auth/handler \
            https://yardup-2026.web.app/ \
            https://app-b3izab6d4q-uc.a.run.app/; do
            echo "::group::$url"
            body="$(mktemp)"
            curl -sS --connect-timeout 8 --max-time 30 -D - -o "$body" \
              -w '\nhttp_status=%{http_code} remote_ip=%{remote_ip} total_seconds=%{time_total}\n' "$url" || true
            python3 - "$body" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          titles = re.findall(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
          print("title=" + repr(titles[:1]))
          print("body_bytes=" + str(len(text.encode())))
          if not titles or "error" in " ".join(titles).lower():
              print("body_prefix=" + repr(text[:1200]))
          PY
            rm -f "$body"
            echo "::endgroup::"
          done
      - name: Checkout deployed source for browser diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e870b94b16079b0a50e6cb5b21d9b5524ba7db26
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install existing browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check live browser pages
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require("@playwright/test");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const viewport of [{ width: 1440, height: 1000 }, { width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const failures = [], errors = [], badResponses = [];
              const safeUrl = raw => { const u = new URL(raw); return u.origin + u.pathname; };
              page.on("pageerror", err => errors.push(err.message.slice(0, 500)));
              page.on("requestfailed", req => failures.push({ url: safeUrl(req.url()), error: req.failure()?.errorText }));
              page.on("response", res => { if (res.status() >= 400) badResponses.push({ url: safeUrl(res.url()), status: res.status() }); });
              for (const path of ["/", "/studio", "/login"]) {
                failures.length = errors.length = badResponses.length = 0;
                try {
                  const response = await page.goto("https://lotfoundry.net" + path, { waitUntil: "domcontentloaded", timeout: 45000 });
                  await page.waitForTimeout(10000);
                  console.log(JSON.stringify({ viewport, path, status: response?.status(), title: await page.title(), url: safeUrl(page.url()), headings: await page.locator("h1,h2").allTextContents(), body: (await page.locator("body").innerText()).slice(0, 1600), failures, errors, badResponses }));
                  if (path === "/") {
                    const menu = page.getByRole("button", { name: /menu/i }).first();
                    if (await menu.isVisible()) {
                      await menu.click();
                      console.log(JSON.stringify({ interaction: "mobile menu", links: await page.getByRole("link").allTextContents() }));
                    }
                  }
                } catch (err) { console.log(JSON.stringify({ viewport, path, navigationError: String(err), failures, errors, badResponses })); }
              }
              await context.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
      - name: Authenticate for read-only Firebase diagnostics
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
      - name: Read app function state
        shell: bash
        run: |
          gcloud functions describe app --gen2 --region=us-central1 \
            --project=yardup-2026 \
            --format='json(name,state,stateMessages,updateTime,buildConfig.runtime,serviceConfig.availableMemory,serviceConfig.timeoutSeconds,serviceConfig.uri)'
      - name: Read recent app server errors
        if: always()
        shell: bash
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="app" AND severity>=ERROR' \
            --project=yardup-2026 --freshness=6h --limit=25 \
            --format='json(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.stack)'
