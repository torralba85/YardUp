name: Signup Canary

on:
  push:
    branches:
      - ops/signup-canary-20260928

permissions:
  contents: read

jobs:
  signup-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live production signup canary
        run: node scripts/live-signup-canary.mjs
