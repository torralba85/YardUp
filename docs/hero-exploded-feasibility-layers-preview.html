<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LotFoundry Hero Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(93,255,225,.14),transparent 28%),linear-gradient(135deg,#100b09,#1d1210 48%,#07110e);color:#f2e5d5;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:fixed;inset:16px 16px auto 16px;display:flex;gap:14px;justify-content:space-between;pointer-events:none}.copy,.controls{border:1px solid rgba(242,229,213,.18);background:rgba(23,17,14,.62);box-shadow:0 22px 80px rgba(0,0,0,.35);backdrop-filter:blur(16px);border-radius:24px;padding:18px}.copy{max-width:560px}.eyebrow{color:#5dffe1;text-transform:uppercase;letter-spacing:.18em;font-size:12px;margin-bottom:8px}h1{font-size:clamp(30px,7vw,68px);line-height:.92;letter-spacing:-.06em;margin:0}.copy p{color:rgba(242,229,213,.72);line-height:1.45;margin:12px 0 0}.controls{width:min(360px,calc(100vw - 32px));pointer-events:auto}.title{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:rgba(242,229,213,.75);margin-bottom:10px}.chip{color:#5dffe1;border:1px solid rgba(93,255,225,.35);border-radius:99px;padding:4px 8px;text-transform:none;letter-spacing:0}.btn{display:block;width:100%;text-align:left;margin:8px 0 0;padding:11px 12px;border-radius:16px;border:1px solid rgba(242,229,213,.12);background:rgba(242,229,213,.08);color:#f2e5d5}.btn.active{border-color:rgba(93,255,225,.7);background:rgba(93,255,225,.13);box-shadow:0 0 28px rgba(93,255,225,.12)}.btn b{display:block}.btn span{display:block;color:rgba(242,229,213,.62);font-size:12px;margin-top:3px}.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));text-align:center;border:1px solid rgba(242,229,213,.14);background:rgba(23,17,14,.55);backdrop-filter:blur(14px);border-radius:999px;padding:12px 16px;font-size:13px;color:rgba(242,229,213,.78)}@media(max-width:820px){.panel{inset:10px;display:block}.copy,.controls{padding:14px;border-radius:20px}.controls{width:100%;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{margin:0}.btn span{display:none}.hint{text-align:left;border-radius:18px;bottom:10px}}
</style>
</head>
<body>
<div class="panel"><section class="copy"><div class="eyebrow">LotFoundry Hero Concept</div><h1>Exploded Feasibility Layers</h1><p>Move over the canvas to separate zoning, structure, shell, and finished value into a premium technical display.</p></section><aside class="controls"><div class="title"><span>Feasibility stack</span><span id="chip" class="chip">assembled</span></div><div id="buttons" class="grid"></div></aside></div><div class="hint">Phone: drag to explode, tap cards to highlight. Desktop: hover the model. Prototype only.</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const data=[['zoning','Zoning regulations','Build envelope and setbacks',0x5dffe1,-1.05,-1.85],['foundation','Foundation','Site prep and bearing base',0xffe08a,-.72,-1.25],['frame','Structural engineering','Framing and load paths',0xff9d63,.08,.45],['shell','Finished exterior','Walls, glazing, siding',0xd7b48a,.22,1.05],['roof','Finished value','Premium completed silhouette',0xb9fff3,1.22,2.45]];
const meta=Object.fromEntries(data.map(d=>[d[0],{id:d[0],title:d[1],detail:d[2],color:d[3],base:d[4],open:d[5]}]));
let active='shell',target=0,explode=0,inside=false;const groups={},hits=[],edges=[];
const app=document.body,buttons=document.getElementById('buttons'),chip=document.getElementById('chip');
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(r.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x100b09,.035);const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);cam.position.set(5.8,3.7,7.2);cam.lookAt(0,.3,0);
scene.add(new THREE.HemisphereLight(0xf2e5d5,0x11241c,1.4));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,7,6);scene.add(key);const rim=new THREE.PointLight(0x5dffe1,9,11);rim.position.set(-4,2,-3);scene.add(rim);
const root=new THREE.Group();scene.add(root);const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(3.55,3.9,.12,96),new THREE.MeshStandardMaterial({color:0x221511,roughness:.9,metalness:.08}));pedestal.position.y=-2.05;root.add(pedestal);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.58,.012,8,160),new THREE.MeshBasicMaterial({color:0x5dffe1,transparent:true,opacity:.38}));ring.rotation.x=Math.PI/2;ring.position.y=-1.96;root.add(ring);
function group(id){const g=new THREE.Group();g.position.y=meta[id].base;g.userData.layer=id;groups[id]=g;root.add(g);return g}function edge(m,id,o=.02){const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,18),new THREE.LineBasicMaterial({color:meta[id].color,transparent:true,opacity:o}));e.position.copy(m.position);e.rotation.copy(m.rotation);e.scale.copy(m.scale);e.userData.layer=id;m.parent.add(e);edges.push(e)}function box(g,id,s,p,c,op=1){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),new THREE.MeshStandardMaterial({color:c,roughness:.58,metalness:.08,transparent:op<1,opacity:op}));m.position.set(...p);m.userData.layer=id;g.add(m);hits.push(m);edge(m,id);return m}
const zg=group('zoning');const grid=new THREE.GridHelper(6.8,18,0x5dffe1,0x3d6a5e);grid.material.transparent=true;grid.material.opacity=.42;zg.add(grid);const env=box(zg,'zoning',[5.6,.025,3.8],[0,0,0],0x5dffe1,.08);edges.at(-1).material.opacity=.75;
const fg=group('foundation');box(fg,'foundation',[4.9,.24,3.25],[0,0,0],0x5a4637);box(fg,'foundation',[4.4,.05,2.76],[0,.16,0],0x81674d);
const fr=group('frame'),wood=0xa66743;[[-2.05,.38,-1.18],[2.05,.38,-1.18],[-2.05,.38,1.18],[2.05,.38,1.18],[0,.38,-1.18],[0,.38,1.18],[-2.05,.38,0],[2.05,.38,0]].forEach(p=>box(fr,'frame',[.11,1.32,.11],p,wood));[[0,1.07,-1.18],[0,1.07,1.18],[-2.05,1.07,0],[2.05,1.07,0]].forEach((p,i)=>box(fr,'frame',i<2?[4.25,.12,.12]:[.12,.12,2.48],p,wood));
const sh=group('shell');box(sh,'shell',[4.35,1.38,.16],[0,.55,-1.28],0xd7b48a,.88);box(sh,'shell',[4.35,1.38,.16],[0,.55,1.28],0xd7b48a,.88);box(sh,'shell',[.16,1.38,2.42],[-2.16,.55,0],0xc79b72,.88);box(sh,'shell',[.16,1.38,2.42],[2.16,.55,0],0xc79b72,.88);box(sh,'shell',[.72,.68,.04],[-.9,.64,-1.38],0x89c7c1,.72);box(sh,'shell',[.72,.68,.04],[.9,.64,-1.38],0x89c7c1,.72);
const rg=group('roof'),w=4.85,d=3.2,h=.78,geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-w/2,0,-d/2,w/2,0,-d/2,0,h,-d/2,-w/2,0,d/2,0,h,d/2,w/2,0,d/2,-w/2,0,-d/2,0,h,-d/2,0,h,d/2,-w/2,0,-d/2,0,h,d/2,-w/2,0,d/2,w/2,0,-d/2,w/2,0,d/2,0,h,d/2,w/2,0,-d/2,0,h,d/2,0,h,-d/2,-w/2,0,-d/2,-w/2,0,d/2,w/2,0,d/2,-w/2,0,-d/2,w/2,0,d/2,w/2,0,-d/2]),3));geo.computeVertexNormals();const rm=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x3c2a23,roughness:.48,metalness:.18}));rm.userData.layer='roof';rg.add(rm);hits.push(rm);edge(rm,'roof');
function drawButtons(){buttons.innerHTML='';data.forEach(d=>{const b=document.createElement('button');b.className='btn'+(active===d[0]?' active':'');b.innerHTML=`<b>${d[1]}</b><span>${d[2]}</span>`;b.onclick=()=>{active=d[0];target=1;inside=true;drawButtons()};buttons.appendChild(b)})}drawButtons();
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();function point(e){const rect=r.domElement.getBoundingClientRect(),x=e.touches?.[0]?.clientX??e.clientX,y=e.touches?.[0]?.clientY??e.clientY;ptr.x=(x-rect.left)/rect.width*2-1;ptr.y=-((y-rect.top)/rect.height*2-1);target=1;inside=true;ray.setFromCamera(ptr,cam);const hit=ray.intersectObjects(hits,false)[0];if(hit?.object?.userData.layer){active=hit.object.userData.layer;drawButtons()}}
r.domElement.onpointermove=point;r.domElement.onpointerenter=()=>{inside=true;target=1};r.domElement.onpointerleave=()=>{inside=false;target=0};r.domElement.addEventListener('touchmove',e=>{e.preventDefault();point(e)},{passive:false});r.domElement.addEventListener('touchstart',e=>{e.preventDefault();point(e)},{passive:false});
function tick(){requestAnimationFrame(tick);explode=THREE.MathUtils.lerp(explode,target,.075);root.rotation.y+=inside?.002:.006;Object.entries(groups).forEach(([id,g])=>{g.position.y=THREE.MathUtils.lerp(meta[id].base,meta[id].open,explode);g.traverse(c=>{if(c.isMesh&&c.material){const on=id===active;c.material.opacity=c.material.transparent?(on?.98:.7):1;c.material.emissive=c.material.emissive||new THREE.Color(0);c.material.emissive.setHex(on?meta[id].color:0);c.material.emissiveIntensity=on?.16:0}})});edges.forEach(e=>e.material.opacity=e.userData.layer===active?.98:.08+explode*.06);chip.textContent=explode>.45?'exploded':'assembled';ring.material.opacity=.28+Math.sin(performance.now()/380)*.1;rim.intensity=8+Math.sin(performance.now()/500)*1.4;r.render(scene,cam)}tick();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
