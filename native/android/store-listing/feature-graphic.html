<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LotFoundry — Google Play feature graphic</title>
<!--
  Source for the Play store listing feature graphic. Render with:
      node scripts/render-feature-graphic.mjs

  Play requires exactly 1024x500, PNG or JPEG, no transparency. Keep the
  wordmark and tagline inside the centre band: some Play surfaces crop this
  wider than 1024x500 and overlay their own controls near the edges.

  Colors are copied from design/tokens.json (the A LOT MORE palette) rather
  than imported, so this file renders standalone without the Next.js build.
  Every literal must stay a canonical palette value; scripts/design/checks.mjs
  enforces that.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --lot-chalk: #F5F5F0;
    --lot-paper: #FDFDF9;
    --lot-surface: #EBEBE6;
    --lot-line: #DADAD3;
    --lot-orange: #FF5B24;
    --lot-orange-ink: #C43708;
    --lot-ink: #161616;
    --lot-stone: #65655F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; }
  body {
    font-family: "Manrope", sans-serif;
    background: var(--lot-chalk);
    color: var(--lot-ink);
    overflow: hidden;
  }

  .plate {
    position: relative;
    width: 1024px;
    height: 500px;
    background: var(--lot-chalk);
    overflow: hidden;
  }

  /* Drafting grid on chalk, kept very quiet. */
  .grid {
    position: absolute;
    inset: 0;
    width: 1024px;
    height: 500px;
    opacity: 0.55;
  }

  /* Parcel diagram: lot boundary, setback line, and the ADU footprint. */
  .parcel { position: absolute; right: 74px; top: 50%; transform: translateY(-50%); }

  .content {
    position: absolute;
    left: 76px;
    top: 50%;
    transform: translateY(-50%);
    width: 540px;
  }

  .kicker {
    font-family: "Manrope", sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--lot-stone);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .kicker::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--lot-line);
  }

  .wordmark {
    margin-top: 20px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 82px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.035em;
    color: var(--lot-ink);
  }

  .tagline {
    margin-top: 20px;
    font-size: 25px;
    font-weight: 400;
    line-height: 1.32;
    color: var(--lot-stone);
    max-width: 470px;
  }

  .meta {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Manrope", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--lot-stone);
  }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--lot-orange); }
</style>
</head>
<body>
  <div class="plate">
    <svg class="grid" width="1024" height="500" aria-hidden="true">
      <defs>
        <pattern id="survey-grid" width="64" height="64" patternUnits="userSpaceOnUse">
          <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#DADAD3" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1024" height="500" fill="url(#survey-grid)"/>
    </svg>

    <svg class="parcel" width="286" height="330" viewBox="0 0 286 330" fill="none">
      <!-- lot boundary -->
      <rect x="13" y="13" width="260" height="304"
            fill="#FDFDF9" fill-opacity="0.72"
            stroke="#65655F" stroke-width="2"/>
      <!-- setback line -->
      <rect x="41" y="41" width="204" height="248"
            fill="none" stroke="#DADAD3" stroke-width="1.5" stroke-dasharray="7 6"/>
      <!-- existing house -->
      <rect x="66" y="66" width="154" height="104"
            fill="#EBEBE6" stroke="#65655F" stroke-width="1.5"/>
      <!-- ADU footprint: the proposed structure, in signal orange -->
      <rect x="92" y="196" width="102" height="70"
            fill="#FF5B24" stroke="#FF5B24" stroke-width="2.5"/>
      <!-- rear setback: ADU wall to the setback line it has to clear -->
      <path d="M120 266 L120 289" stroke="#C43708" stroke-width="1.5"/>
      <path d="M113 266 L127 266" stroke="#C43708" stroke-width="1.5"/>
      <path d="M113 289 L127 289" stroke="#C43708" stroke-width="1.5"/>
      <text x="133" y="282" font-family="Manrope, sans-serif" font-size="11"
            font-weight="600" fill="#C43708" letter-spacing="0.08em">5&#39;-0&quot;</text>
      <!-- ADU label, carbon on orange -->
      <text x="143" y="237" text-anchor="middle" font-family="Manrope, sans-serif"
            font-size="12" font-weight="700" fill="#161616" letter-spacing="0.08em">ADU</text>
    </svg>

    <div class="content">
      <div class="kicker">ADU Feasibility</div>
      <div class="wordmark">LotFoundry</div>
      <div class="tagline">See what your backyard can earn before you spend a dollar on plans.</div>
      <div class="meta">
        <span>Rent</span><span class="dot"></span>
        <span>Build cost</span><span class="dot"></span>
        <span>Payback</span>
      </div>
    </div>
  </div>
</body>
</html>
