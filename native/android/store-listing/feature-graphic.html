<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LotFoundry — Google Play feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Standalone copy of design/tokens.json; verified by the renderer. */
  :root { --color-lot-chalk: #F5F5F0; --color-lot-ink: #161616; --color-lot-line: #DADAD3; --color-lot-stone: #65655F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { background: var(--color-lot-chalk); color: var(--color-lot-ink); font-family: "Manrope", sans-serif; }
  main { width: 1024px; height: 500px; position: relative; display: grid; grid-template-columns: 47% 53%; align-items: center; }
  .copy { padding-left: 64px; position: relative; z-index: 1; }
  .brand { font-family: "Space Grotesk", sans-serif; font-size: 23px; font-weight: 600; letter-spacing: -0.04em; margin-bottom: 28px; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 55px; line-height: 1.02; letter-spacing: -0.06em; font-weight: 500; }
  .detail { margin-top: 25px; max-width: 340px; font-size: 18px; line-height: 1.5; }
  figure { width: 100%; }
  img { display: block; width: 530px; height: 398px; object-fit: contain; }
  footer { position: absolute; bottom: 30px; left: 64px; right: 52px; border-top: 1px solid var(--color-lot-line); padding-top: 12px; color: var(--color-lot-stone); font-size: 12px; }
</style>
</head>
<body>
<main>
  <section class="copy">
    <p class="brand">LotFoundry.</p>
    <h1>A backyard home.<br>A clearer plan.</h1>
    <p class="detail">Explore ADU fit, estimated build cost and rental income.</p>
  </section>
  <figure><img src="../../../public/landing/a-lot-more/parcel-after.webp" alt="Illustrative model of a backyard home on a residential lot"></figure>
  <footer>Concept imagery · Planning estimates, not permit approval or guaranteed returns.</footer>
</main>
</body>
</html>
