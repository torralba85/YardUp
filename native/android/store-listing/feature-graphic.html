<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LotFoundry — Google Play feature graphic</title>
<!--
  Source for the Play store listing feature graphic. Render with:
      node scripts/render-feature-graphic.mjs

  Play requires exactly 1024x500, PNG or JPEG, no transparency. Keep the
  wordmark and tagline inside the centre band: some Play surfaces crop this
  wider than 1024x500 and overlay their own controls near the edges.

  Colors are copied from app/globals.css (the Warm Earth palette) rather than
  imported, so this file renders standalone without the Next.js build.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lf-sand: #F2E5D5;
    --lf-sand-2: #F8F0E4;
    --lf-card: #FBF6EE;
    --lf-taupe: #BFA58E;
    --lf-clay: #8C5B3F;
    --lf-clay-ink: #6F3F28;
    --lf-mahogany: #592A0F;
    --lf-espresso: #261307;
    --lf-muted: #6B5B4D;
    --lf-hairline: #E0CDB4;
    --lf-forest: #2F4A38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; }
  body {
    font-family: "Instrument Sans", system-ui, sans-serif;
    background: var(--lf-sand);
    color: var(--lf-espresso);
    overflow: hidden;
  }

  .plate {
    position: relative;
    width: 1024px;
    height: 500px;
    background: var(--lf-sand);
    overflow: hidden;
  }

  /* Cadastral survey grid — the recorded-fact layer, kept very quiet. */
  .grid {
    position: absolute;
    inset: 0;
    width: 1024px;
    height: 500px;
    opacity: 0.2;
  }

  /* Parcel diagram: lot boundary, setback line, and the ADU footprint. */
  .parcel { position: absolute; right: 74px; top: 50%; transform: translateY(-50%); }

  .content {
    position: absolute;
    left: 76px;
    top: 50%;
    transform: translateY(-50%);
    width: 540px;
  }

  .kicker {
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lf-muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .kicker::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--lf-hairline);
  }

  .wordmark {
    margin-top: 20px;
    font-family: "Libre Franklin", system-ui, sans-serif;
    font-size: 82px;
    font-weight: 700;
    line-height: 0.98;
    letter-spacing: -0.018em;
    color: var(--lf-espresso);
  }

  .tagline {
    margin-top: 20px;
    font-size: 25px;
    font-weight: 400;
    line-height: 1.32;
    color: var(--lf-clay-ink);
    max-width: 470px;
  }

  .meta {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lf-muted);
  }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--lf-taupe); }
</style>
</head>
<body>
  <div class="plate">
    <svg class="grid" width="1024" height="500" aria-hidden="true">
      <defs>
        <pattern id="survey-grid" width="64" height="64" patternUnits="userSpaceOnUse">
          <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#BFA58E" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1024" height="500" fill="url(#survey-grid)"/>
    </svg>

    <svg class="parcel" width="286" height="330" viewBox="0 0 286 330" fill="none">
      <!-- lot boundary -->
      <rect x="13" y="13" width="260" height="304" rx="3"
            fill="#FBF6EE" fill-opacity="0.72"
            stroke="#8C5B3F" stroke-width="2"/>
      <!-- setback line -->
      <rect x="41" y="41" width="204" height="248" rx="2"
            fill="none" stroke="#BFA58E" stroke-width="1.5" stroke-dasharray="7 6"/>
      <!-- existing house -->
      <rect x="66" y="66" width="154" height="104" rx="2"
            fill="#BFA58E" fill-opacity="0.34" stroke="#8C5B3F" stroke-width="1.5"/>
      <!-- ADU footprint: the thing being tested -->
      <rect x="92" y="196" width="102" height="70" rx="2"
            fill="#2F4A38" fill-opacity="0.13" stroke="#2F4A38" stroke-width="2.5"/>
      <!-- rear setback: ADU wall to the setback line it has to clear -->
      <path d="M120 266 L120 289" stroke="#2F4A38" stroke-width="1.5"/>
      <path d="M113 266 L127 266" stroke="#2F4A38" stroke-width="1.5"/>
      <path d="M113 289 L127 289" stroke="#2F4A38" stroke-width="1.5"/>
      <text x="133" y="282" font-family="DM Mono, monospace" font-size="11"
            font-weight="500" fill="#2F4A38" letter-spacing="0.06em">5&#39;-0&quot;</text>
      <!-- ADU label -->
      <text x="143" y="237" text-anchor="middle" font-family="DM Mono, monospace"
            font-size="12" font-weight="500" fill="#2F4A38" letter-spacing="0.14em">ADU</text>
    </svg>

    <div class="content">
      <div class="kicker">ADU Feasibility</div>
      <div class="wordmark">LotFoundry</div>
      <div class="tagline">See what your backyard can earn before you spend a dollar on plans.</div>
      <div class="meta">
        <span>Rent</span><span class="dot"></span>
        <span>Build cost</span><span class="dot"></span>
        <span>Payback</span>
      </div>
    </div>
  </div>
</body>
</html>
